spring.application.name=Anda-Bazaar

# =========================
# SERVER
# =========================
server.port=8080


# =========================
# MYSQL DATABASE
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/anda_bazaar?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info


# =========================
# JWT
# =========================
jwt.secret=AndaBazaarSuperSecretKeyForJwtAuthentication2026VeryLongKey
jwt.expiration=86400000


# =========================
# RAZORPAY
# =========================

# Razorpay Test/Live Key ID
razorpay.key.id=YOUR_RAZORPAY_KEY_ID

# Razorpay Secret
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

# Webhook secret
razorpay.webhook.secret=YOUR_RAZORPAY_WEBHOOK_SECRET